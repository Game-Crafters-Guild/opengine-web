<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model viewer</title>
<!-- Cross-origin isolation for the threaded build on hosts that cannot set headers: the
     service worker adds COOP and COEP require-corp; the first visit reloads once. -->
<script>window.coi = { coepCredentialless: () => false };</script>
<script src="../../coi-serviceworker.js"></script>
<!-- Where the library is served from; the package build sets this. -->
<script type="importmap">{ "imports": { "@openengine/web": "../../opengine.mjs" } }</script>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<!-- The download bar along the top edge, and the status over the canvas until the first frame
     draws: both show whatever the viewport and whether the panel is open. -->
<progress class="download" hidden></progress>
<canvas></canvas>
<p class="canvas-status">Loading the engine...</p>
<details class="panel" open>
<summary>Model viewer <span class="summary-progress"></span></summary>
<p class="hint">Early access (alpha): the engine and its API change between releases.</p>
<!-- The controls stay disabled until the engine starts (panel.js enables them). -->
<label>Model <select name="model" disabled></select></label>
<label class="button">Open a .glb <input type="file" name="file" accept=".glb,.gltf" disabled></label>
<p class="hint">or drop one on the page. A .gltf must embed its buffers and images; FBX is not supported on the web.</p>
<label>Time of day <output name="clock"></output><input type="range" name="time" min="6" max="18" step="0.05" title="6:00 to 18:00: the lit hours" disabled></label>
<label class="check"><input type="checkbox" name="turn" checked disabled> Turntable</label>
<button type="button" name="fps" disabled>Frame rate <kbd>F</kbd></button>
<output name="status">Loading the engine...</output>
<p class="credit"></p>
</details>
<div class="fps" hidden></div>
<!-- On a narrow page the panel is a strip over the lower canvas: it starts collapsed there. -->
<script>if (matchMedia('(max-width: 600px)').matches) document.querySelector('.panel').open = false;</script>
<script type="module" src="main.js"></script>
</body>
</html>
